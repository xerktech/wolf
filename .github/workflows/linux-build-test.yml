name: Linux build and test

on:
  push:
    paths-ignore:
      - "docs/**"
      - "docker/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "docker/**"

env:
  GST_WAYLAND_COMMIT: 016b4fc

jobs:
  # Build the Rust-based libgstwaylanddisplay for both architectures
  build-gst-wayland:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
            lib_path: x86_64-linux-gnu
    steps:
      - name: Restore cached libgstwaylanddisplay-${{ matrix.arch }}
        id: cache-gst-wayland
        uses: actions/cache@v5
        with:
          path: ${{runner.workspace}}/usr
          key: libgstwaylanddisplay-${{ matrix.arch }}-${{ env.GST_WAYLAND_COMMIT }}

      - name: Prepare environment
        if: steps.cache-gst-wayland.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
              libwayland-dev libwayland-server0 libinput-dev libxkbcommon-dev libgbm-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Setup Rust
        if: steps.cache-gst-wayland.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Setup gst-wayland-display
        if: steps.cache-gst-wayland.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/games-on-whales/gst-wayland-display
          cd gst-wayland-display
          git checkout ${{ env.GST_WAYLAND_COMMIT }}
          cargo install --locked cargo-c
          cargo cinstall -p gst-plugin-wayland-display --prefix=/usr/local --destdir=${{runner.workspace}}

      - name: Archive libgstwaylanddisplay-${{ matrix.arch }}
        uses: actions/upload-artifact@v7
        with:
          name: libgstwaylanddisplay-${{ matrix.arch }}
          path: |
            ${{runner.workspace}}/usr/local/lib/${{ matrix.lib_path }}/liblibgstwaylanddisplay*
            ${{runner.workspace}}/usr/local/lib/${{ matrix.lib_path }}/pkgconfig/
            ${{runner.workspace}}/usr/local/lib/${{ matrix.lib_path }}/gstreamer-1.0/
            ${{runner.workspace}}/usr/local/include/libgstwaylanddisplay/*
          if-no-files-found: error

  # Now run the actual test suite
  test:
    runs-on: ubuntu-26.04
    needs: build-gst-wayland
    timeout-minutes: 120
    env:
      ASAN_OPTIONS: detect_leaks=0
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: asan-fixed, cxx: g++, other_pkgs: "", arch: x86_64, unfix: "0", flags: "-fsanitize=address -fno-omit-frame-pointer -fPIC", btype: RelWithDebInfo, reps: "1"}
    steps:
      - uses: actions/checkout@v6

      - name: Download pre-built libgstwaylanddisplay-${{ matrix.arch }}
        uses: actions/download-artifact@v8
        with:
          name: libgstwaylanddisplay-${{ matrix.arch }}
          path: ${{runner.workspace}}/libgstwaylanddisplay

      - name: Prepare environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
              ninja-build \
              meson \
              extra-cmake-modules \
              libicu-dev \
              libboost-locale-dev libboost-thread-dev libboost-filesystem-dev libboost-log-dev libboost-stacktrace-dev libboost-container-dev libboost-json-dev \
              libssl-dev \
              libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
              libwayland-dev libwayland-server0 wayland-protocols libinput-dev libxkbcommon-dev libgbm-dev \
              libcurl4-openssl-dev \
              libpulse-dev \
              libevdev-dev \
              libudev-dev \
              libdrm-dev \
              libpci-dev \
              libunwind-dev \
              ${{ matrix.other_pkgs }}

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: qa-${{ matrix.name }}

      - name: Setup gst-interpipe
        run: |
          git clone https://github.com/games-on-whales/gst-interpipe.git
          cd gst-interpipe
          mkdir build
          meson build -Denable-gtk-doc=false --prefix ${{runner.workspace}}/libgstwaylanddisplay
          meson install -C build

      - name: Revert fix (control)
        if: matrix.unfix == '1'
        run: git fetch -q --unshallow origin && git checkout a2a6562 -- src/moonlight-server/api/endpoints.cpp src/moonlight-server/control/control.cpp && git diff --cached --stat

      - name: Configure build
        working-directory: ${{runner.workspace}}
        env:
          CXX: ${{matrix.cxx}}
        run: |
          cmake -Bbuild -H$GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=${{ matrix.btype }} -DCMAKE_CXX_STANDARD=20 \
                -DCMAKE_CXX_EXTENSIONS=OFF -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache \
                -DBUILD_SHARED_LIBS=ON -DCATCH_DEVELOPMENT_BUILD=ON -DTEST_VIRTUAL_INPUT=OFF -DTEST_DOCKER=OFF \
                -DTEST_NVIDIA=OFF -DTEST_SDL=OFF -DTEST_EXCEPTIONS=OFF \
                "-DCMAKE_C_FLAGS=${{ matrix.flags }}" "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}" \
                "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.flags }}" "-DCMAKE_SHARED_LINKER_FLAGS=${{ matrix.flags }}" -G Ninja

      - name: Build tests + lib
        working-directory: ${{runner.workspace}}/build
        run: ninja -j $(nproc) wolftests

      - name: Run QA experiments
        working-directory: ${{runner.workspace}}/build/tests
        env:
          HOST_APPS_STATE_FOLDER: ${{runner.workspace}}
          GST_PLUGIN_PATH: ${{runner.workspace}}/libgstwaylanddisplay
          XDG_RUNTIME_DIR: /tmp
          RUST_LOG: FATAL
        run: |
          set +e
          for i in $(seq 1 ${{ matrix.reps }}); do
            QA_ROUNDS=20 ./wolftests "Runners: many concurrent starts on one session that exit at once" > run_$i.log 2>&1
            rc=$?; echo "QARESULT many-starts rep=$i rc=$rc"
            if [ $rc -ne 0 ]; then grep -n -A40 "ERROR: AddressSanitizer" run_$i.log | head -80; tail -5 run_$i.log; fi
          done
          for t in "QA: shutdown loop held snapshot (663daa1 shape)" "QA: shutdown loop load() temporary (pre-fix shape control)" "QA: pending pair listing while pair requests change" "QA: pending pair listing while pair requests change" "QA: pending pair listing while pair requests change"; do
            ./wolftests "$t" > qa2.log 2>&1; rc=$?; echo "QARESULT [$t] rc=$rc"
            grep -n "QA shutdown loop\|FAILED\|with expansion\|test cases\|No test" -A2 qa2.log | head -12
            grep -n -A30 "ERROR: AddressSanitizer" qa2.log | grep -v "^[0-9]*-    #[0-9]* 0x[0-9a-f]* in \(std::\|immer::detail\|__\)" | cut -c1-220 | head -40
          done
          for t in "QA: process runners survive StopStreamEvents while siblings exit" "QA: double StopStreamEvent for one session with live runners"; do
            for i in 1 2 3; do
              ./wolftests "$t" > qa.log 2>&1; rc=$?; echo "QARESULT [$t] rep=$i rc=$rc"
              grep -n "QA storm fired\|terminate called\|what()\|killpg\|SIG[A-Z]*\|test cases" qa.log | head -8
            done
          done
          if [ "${{ matrix.name }}" = "release-fixed" ]; then
            ./wolftests "~[QA]" > full.log 2>&1; echo "QARESULT full-suite rc=$?"; grep -n "FAILED\|test cases" full.log | head -20
          fi
          exit 0
