# xerktech fork: builds only the Wolf image and pushes it to ghcr.io/xerktech/wolf.
# Upstream's version also rebuilds and pushes gpu-drivers and gstreamer (to
# Docker Hub as well); the fork reuses upstream's GStreamer image instead, pinned
# by digest, so only Wolf itself differs from upstream's build.
name: Docker build

on:
  push:
    # Only the fork's main branch publishes images: PR branches must not push to ghcr.io.
    # (A tag has no {{branch}}, so the sha tag would be an invalid ":-<sha>".)
    branches: ["xerktech"]
    paths-ignore:
      - "docs/**"
  # Manual run on a branch builds :<branch> on purpose (e.g. testing a rebase in fenrir before moving xerktech)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Each build would otherwise upload a .dockerbuild record artifact that counts
  # against the org's shared Actions storage quota (XERK-1796).
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  # docker/wolf.Dockerfile's default BASE_IMAGE (Fedora 44), pinned. Bump it together with
  # that default when rebasing onto a stable that moves GStreamer.
  BASE_IMAGE: ghcr.io/games-on-whales/gstreamer:1.26.7@sha256:f71d899c3ea3607b65e676ffe789e549e761abefb23e26435541201202abfba9

jobs:
  wolf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # :<branch> and :<branch>-<short sha>; deploy by digest, not by tag.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/wolf
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
          flavor: latest=false

      - name: Build Wolf
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/wolf.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          cache-from: type=gha,scope=wolf
          cache-to: type=gha,mode=max,scope=wolf

      - name: Image digest
        run: echo "ghcr.io/${{ github.repository_owner }}/wolf@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

      # Smoke-test the image just pushed, by digest: binaries, dynamic linking,
      # compositor plugin + software encoder, embedded PulseAudio, and a full
      # entrypoint boot under supervisord. GPU-dependent elements are not
      # checked (no GPU on CI runners).
      - name: Smoke test image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/wolf@${{ steps.build.outputs.digest }}"
          docker pull "$IMAGE"
          docker run --rm --entrypoint "" \
            -v "$(pwd)/docker/smoke-test.sh:/smoke.sh:ro" \
            "$IMAGE" bash /smoke.sh
